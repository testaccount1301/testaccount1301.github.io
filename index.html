<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock the Files</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #game-container { position: relative; border: 4px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        canvas { display: block; background: #000; }
        #ui { position: absolute; top: -40px; width: 100%; text-align: center; font-size: 20px; }
        #unlock-section { display: none; margin-top: 20px; text-align: center; background: #333; padding: 20px; border-radius: 10px; border: 2px solid #0f0; }
        input { padding: 10px; width: 300px; border-radius: 5px; border: none; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #0f0; color: #000; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; }
        button:hover { background: #0a0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            <div id="ui">Score: <span id="score">0</span> / 25</div>
            <canvas id="snakeGame" width="400" height="400"></canvas>
        </div>
    </div>

    <div id="unlock-section">
        <h2>🔓 ACCESS GRANTED</h2>
        <p>Enter the GitHub Repo Path (e.g., <code>owner/repo/file.txt</code>)</p>
        <input type="text" id="repoPath" placeholder="username/repository/path/to/file">
        <br>
        <button onclick="downloadFile()">Download File</button>
    </div>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const unlockSection = document.getElementById("unlock-section");
        const gameWrapper = document.getElementById("game-wrapper");

        let score = 0;
        let gameRunning = true;
        let box = 20;
        let snake = [{x: 9 * box, y: 10 * box}];
        let food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
        let dir;

        // Cheat Code Logic
        const cheatCode = ['ArrowUp', 'ArrowUp', 'ArrowLeft', 'ArrowLeft', 'a', 'b', 'Enter'];
        let inputSequence = [];

        document.addEventListener('keydown', (e) => {
            // Snake Controls
            if(e.keyCode == 37 && dir != "RIGHT") dir = "LEFT";
            else if(e.keyCode == 38 && dir != "DOWN") dir = "UP";
            else if(e.keyCode == 39 && dir != "LEFT") dir = "RIGHT";
            else if(e.keyCode == 40 && dir != "UP") dir = "DOWN";

            // Cheat Code Tracking
            inputSequence.push(e.key);
            if (inputSequence.length > cheatCode.length) inputSequence.shift();
            if (JSON.stringify(inputSequence) === JSON.stringify(cheatCode)) {
                unlock();
            }
        });

        function unlock() {
            gameRunning = false;
            gameWrapper.classList.add('hidden');
            unlockSection.style.display = 'block';
        }

        function draw() {
            if(!gameRunning) return;
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#0f0" : "#0a0";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if( dir == "LEFT") snakeX -= box;
            if( dir == "UP") snakeY -= box;
            if( dir == "RIGHT") snakeX += box;
            if( dir == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                scoreElement.innerText = score;
                food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
                if(score >= 25) unlock();
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                score = 0;
                scoreElement.innerText = score;
                snake = [{x: 9 * box, y: 10 * box}];
                dir = null;
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function downloadFile() {
            const path = document.getElementById('repoPath').value;
            if(!path) return alert("Please enter a path!");
            
            // We call our backend server here, NOT GitHub directly
            window.location.href = `/download?path=${encodeURIComponent(path)}`;
        }

        setInterval(draw, 100);
    </script>
</body>
</html>
