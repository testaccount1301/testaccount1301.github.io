<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebStrike: Skin Simulator</title>
    <style>
        :root {
            --primary: #ffb400;
            --dark: #1a1a1a;
            --panel: #2a2a2a;
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Game Canvas Area */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
            background: radial-gradient(circle, #444 0%, #111 100%);
        }

        canvas {
            display: block;
        }

        /* UI Overlay */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        .stat {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            margin-bottom: 5px;
        }

        #money-display { color: #4caf50; }

        /* Menu Systems */
        .menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel);
            padding: 30px;
            border-radius: 10px;
            border: 3px solid var(--primary);
            text-align: center;
            display: none;
            min-width: 400px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .menu.active { display: block; }

        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn:hover { background: #fff; scale: 1.05; }
        .btn:disabled { background: #666; cursor: not-allowed; }

        /* Shop Grid */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .skin-item {
            background: #333;
            padding: 10px;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .skin-item:hover { border-color: var(--primary); }
        .skin-item.owned { border-color: #4caf50; }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .ch-line {
            position: absolute;
            background: #0f0;
        }
        .v-line { width: 2px; height: 100%; left: 9px; }
        .h-line { width: 100%; height: 2px; top: 9px; }

        #nav-btns {
            position: absolute;
            bottom: 20px;
            right: 20px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="crosshair">
            <div class="ch-line v-line"></div>
            <div class="ch-line h-line"></div>
        </div>

        <div id="hud">
            <div class="stat" id="money-display">Money: $0</div>
            <div class="stat" id="score-display">Score: 0</div>
        </div>

        <div id="nav-btns">
            <button class="btn" onclick="toggleMenu('shop-menu')">Shop</button>
            <button class="btn" onclick="toggleMenu('case-menu')">Open Case</button>
        </div>

        <!-- Shop Menu -->
        <div id="shop-menu" class="menu">
            <h2>Weapon Skins</h2>
            <div class="shop-grid" id="shop-grid">
                <!-- Skins injected by JS -->
            </div>
            <button class="btn" onclick="toggleMenu('shop-menu')">Close</button>
        </div>

        <!-- Case Menu -->
        <div id="case-menu" class="menu">
            <h2>Case Opening</h2>
            <p>Price: $500</p>
            <div id="case-result" style="font-size: 20px; margin: 20px; height: 30px; color: var(--primary);"></div>
            <button class="btn" id="open-case-btn" onclick="openCase()">Open Case</button>
            <br>
            <button class="btn" onclick="toggleMenu('case-menu')">Close</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const moneyEl = document.getElementById('money-display');
    const scoreEl = document.getElementById('score-display');

    // Game State
    let gameState = {
        money: 0,
        score: 0,
        currentSkin: '#888',
        ownedSkins: ['#888'],
        isFiring: false,
        recoilY: 0,
        muzzleFlash: 0
    };

    const skins = [
        { name: 'Default', color: '#888', price: 0 },
        { name: 'Neon Blue', color: '#00f2ff', price: 200 },
        { name: 'Blood Red', color: '#ff0000', price: 500 },
        { name: 'Emerald', color: '#50ff50', price: 1000 },
        { name: 'Gold Rush', color: '#ffd700', price: 5000 },
        { name: 'Void', color: '#4b0082', price: 10000 },
    ];

    let targets = [];
    let mouse = { x: 0, y: 0 };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Target Logic
    class Target {
        constructor() {
            this.radius = Math.random() * 20 + 20;
            this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
            this.y = Math.random() * (canvas.height - this.radius * 2) + this.radius;
            this.life = 2000; // 2 seconds
            this.createdAt = Date.now();
            this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.closePath();
        }
    }

    function spawnTarget() {
        if (targets.length < 5) {
            targets.push(new Target());
        }
        setTimeout(spawnTarget, Math.random() * 1000 + 500);
    }

    // Input Handling
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    window.addEventListener('mousedown', () => {
        gameState.isFiring = true;
        gameState.muzzleFlash = 5;
        gameState.recoilY = 20;
        
        // Hit Detection
        for (let i = targets.length - 1; i >= 0; i--) {
            let t = targets[i];
            let dist = Math.hypot(mouse.x - t.x, mouse.y - t.y);
            if (dist < t.radius) {
                targets.splice(i, 1);
                gameState.score += 1;
                gameState.money += 25;
                updateHUD();
            }
        }
    });

    window.addEventListener('mouseup', () => {
        gameState.isFiring = false;
    });

    function updateHUD() {
        moneyEl.innerText = `Money: $${gameState.money}`;
        scoreEl.innerText = `Score: ${gameState.score}`;
    }

    // Skin & Shop Logic
    function initShop() {
        const grid = document.getElementById('shop-grid');
        grid.innerHTML = '';
        skins.forEach(skin => {
            const div = document.createElement('div');
            div.className = `skin-item ${gameState.ownedSkins.includes(skin.color) ? 'owned' : ''}`;
            div.innerHTML = `
                <div style="width:100%; height:20px; background:${skin.color}; margin-bottom:5px"></div>
                <div>${skin.name}</div>
                <div>$${skin.price}</div>
            `;
            div.onclick = () => buySkin(skin);
            grid.appendChild(div);
        });
    }

    function buySkin(skin) {
        if (gameState.ownedSkins.includes(skin.color)) {
            gameState.currentSkin = skin.color;
        } else if (gameState.money >= skin.price) {
            gameState.money -= skin.price;
            gameState.ownedSkins.push(skin.color);
            gameState.currentSkin = skin.color;
            updateHUD();
        }
        initShop();
    }

    function openCase() {
        if (gameState.money < 500) return;
        gameState.money -= 500;
        updateHUD();

        const resultEl = document.getElementById('case-result');
        resultEl.innerText = "Opening...";
        
        setTimeout(() => {
            const randomSkin = skins[Math.floor(Math.random() * skins.length)];
            gameState.ownedSkins.push(randomSkin.color);
            resultEl.innerText = `You got: ${randomSkin.name}!`;
            initShop();
        }, 1000);
    }

    function toggleMenu(id) {
        const menu = document.getElementById(id);
        const isActive = menu.classList.contains('active');
        document.querySelectorAll('.menu').forEach(m => m.classList.remove('active'));
        if (!isActive) menu.classList.add('active');
    }

    // Render Loop
    function drawWeapon() {
        const gunX = canvas.width * 0.75;
        const gunY = canvas.height - 200 + gameState.recoilY;

        // Muzzle Flash
        if (gameState.muzzleFlash > 0) {
            ctx.beginPath();
            ctx.arc(gunX + 100, gunY, 40, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
            ctx.fill();
            gameState.muzzleFlash--;
        }

        // Gun Body (Simplified stylized shape)
        ctx.fillStyle = gameState.currentSkin;
        ctx.fillRect(gunX, gunY, 150, 40); // Barrel
        ctx.fillRect(gunX + 20, gunY + 40, 40, 100); // Grip
        
        // Details
        ctx.fillStyle = '#333';
        ctx.fillRect(gunX + 140, gunY + 5, 10, 30); // Muzzle
        ctx.fillRect(gunX + 40, gunY - 10, 30, 10); // Sight
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Move recoil back down
        if (gameState.recoilY > 0) gameState.recoilY -= 2;

        // Draw Targets
        const now = Date.now();
        targets = targets.filter(t => now - t.createdAt < t.life);
        targets.forEach(t => t.draw());

        drawWeapon();

        requestAnimationFrame(gameLoop);
    }

    // Start
    spawnTarget();
    initShop();
    gameLoop();

</script>
</body>
</html>
