<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 40px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            color: #cbd5e1;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hello! 👋</h1>

        <p>
            Welcome to my website.
        </p>

        <a class="button" href="https://github.com/testaccount1301">
            My GitHub
        </a>
    </div>

</body>
</html>
